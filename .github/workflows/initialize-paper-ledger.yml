name: initialize-paper-ledger
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astock-ledger-maintenance
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is missing"
            exit 1
          fi
      - name: Initialize paper-trading ledger schema and accounts
        run: python -c "import sys; sys.path.insert(0, 'Astock'); import pg_ledger; pg_ledger.init_ledger(); print('PAPER_LEDGER_INITIALIZED')"
      - name: Verify tables and accounts
        run: python Astock/db_probe.py
