name: heartbeat
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1-5"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Check quote sources
        run: python Astock/source_probe.py
      - name: Check database (read-only)
        run: python Astock/db_probe.py
