name: daily-job
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Legacy input; execution is always read-only"
        type: boolean
        required: true
        default: true
  schedule:
    - cron: "30 7 * * 1-5"

permissions:
  contents: read
concurrency:
  group: astock-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline self-test
        run: python Astock/daily_job.py --selftest
      - name: Read-only database probe
        run: python Astock/db_probe.py
      - name: Read-only market signal analysis (never places simulated trades)
        run: python Astock/run_cloud.py --dry-run
