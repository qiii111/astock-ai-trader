name: missed-run-check
on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 1-5"
    - cron: "30 13 * * 1-5"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install database driver
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Check expected run
        run: python Astock/missed_run_check.py
